# dsh-tool-gate — 渐进披露（工具网关）
#
# 把第三方工具与低频内置工具按家族收进各自的网关工具，使 wire 上的 tools 数组
# 逐字节恒定，从而不再因为「工具定义变了」而重付整段提示前缀。
#
# 默认 enabled: false —— 装好但不动任何东西。确认自己需要省这 2 万 token 后，
# 在 设置 → 插件 → 工具网关 里打开开关（或把下面的 enabled 改成 true）。
#
# families 是归属表：包名精确匹配 package.json 的 name；prefixes 是工具名前缀；
# 内置家族的 tools 是显式成员名单。改这里等于改「哪些工具被收起」；
# 留空某家族的 packages/prefixes/tools 会回落到内置默认表。
#
# 提示词披露（promptDisclosure / promptPlugins）默认全关：开启后，已折叠家族的
# 插件提示词不再每轮注入，改为在该家族 action=list 时随成员定义返回。
- insert:
    - id: dsh-tool-gate
      name: dsh-tool-gate
      config:
        enabled: false

        # ——— 设置页开关（也是下面这些的默认值）——————————————————
        # 网关调用是否沿用成员自身的并发安全声明。保守起见默认关闭（串行）。
        concurrencyDelegate: false
        # action=list 返回成员的完整参数定义。关掉更省 token，但模型可能要试一轮。
        listDetail: true
        # 在系统提示里加一句「这些工具已收进网关」的固定说明。
        staticNotice: true
        # 额外挂一道 tools.guard 拦住绕过网关的直呼（monotonic，不改工具集）。
        guardFallback: true

        # 模型直接调用已收起工具时，拦截并提示改走网关。
        interceptDirectCalls: true

        # 内置工具家族（会话检索、日程等第一方工具）是否也折叠。默认开启。
        # 关掉后它们常驻 wire，第一方工具不再自动成族。
        builtinFamilies: true

        # 自动成族：每个第三方插件包自动成为一个家族。默认开启。
        # 关掉后只有下面 families 里显式点名的项会折叠（完全手动模式）。
        autoFamilies: true

        # 提示词披露：总开关默认关闭；promptPlugins 里逐插件开启（key = 包名）。
        promptDisclosure: false
        promptPlugins: {}

        # 认不出归属的工具：expose = 留在 wire 上（安全）；collapse = 一并收起（省得多）。
        unknownOwnerPolicy: expose

        # 网关工具名前缀，留空则直接用家族 id：blender_plugin / mcp_connector / github / …
        gatewayPrefix: ""

        # 网关描述的字数上限（按码点）。0 = 不限，插件自述整段进入描述。
        maxDescriptionChars: 0

        # 检测到 PTC（run_code）呈现模式时的行为：disable = 整体停用（推荐）。
        ptcMode: disable

        # 会话内冻结工具集。关掉会每轮重算，重新触发前缀重写，失去本插件意义。
        freeze: true

        # 强制常驻 / 强制收起（按工具名，与归属无关）
        alwaysExpose: []
        alwaysHide: []

        # ——— 家族覆盖（全部可选，留空即自动）———————————————————————
        # 家族不需要在这里登记。每个第三方插件包会自动成为一个家族，成员由
        # 「谁注册了这个工具」推导，家族 id 由包名推导；装新插件、重载一次即可生效。
        #
        # 这里只写「要改默认行为」的项，可选字段：
        #   enabled: false        这个家族不折叠（成员直接常驻 wire，网关消失）
        #   label / description   改设置页上显示的名字
        #   gateway               改网关工具名（默认 = 家族 id）
        #   packages: [pkg, ...]  把几个包合并成一个家族（被合并的自动家族会消失）
        #   tools: [name, ...]    显式点名成员，用于从一个包里只挑几个工具
        #   prefixes: ["mcp__"]   按工具名前缀归族
        #
        # 例：
        #   families:
        #     mcp_connector:
        #       gateway: mcp
        #     my-combo:
        #       label: 我的组合
        #       packages: [dsh-image-gen, dsh-video-storyboard]
        families: {}
